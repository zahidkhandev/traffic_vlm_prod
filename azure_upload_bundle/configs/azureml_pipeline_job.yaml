$schema: https://azuremlschemas.azureedge.net/latest/pipelineJob.schema.json
type: pipeline
display_name: qwen-auto-qc-dag
experiment_name: qwen_auto_qc
settings:
  default_compute: azureml:autoqc-sandbox-dev-gpu-cluster
  force_rerun: true

inputs:
  images_path:
    type: uri_folder
    path: azureml:autoqc-sandbox-dev-bdd-images-01:1
  labels_path:
    type: uri_folder
    path: azureml:autoqc-sandbox-dev-bdd-labels-01:1

outputs:
  evaluation_report:
    type: uri_folder

jobs:
  prepare_data:
    type: command
    is_deterministic: false
    code: ..
    environment: azureml:qwen-autoqc-sandbox-dev:6
    command: >-
      python scripts/azure/prepare_pipeline_inputs.py
      --images-path ${{inputs.images_path}}
      --labels-path ${{inputs.labels_path}}
      --output-dir ${{outputs.prepared_data}}
    inputs:
      images_path: ${{parent.inputs.images_path}}
      labels_path: ${{parent.inputs.labels_path}}
    outputs:
      prepared_data:
        type: uri_folder

  run_inference:
    type: command
    is_deterministic: false
    code: ..
    environment: azureml:qwen-autoqc-sandbox-dev:6
    command: >-
      python scripts/azure/run_pipeline_inference.py
      --config configs/azureml.yaml
      --prepared-inputs ${{inputs.prepared_data}}/prepared_inputs.json
      --model-path qwen-vl-4b
      --output-dir ${{outputs.inference_output}}
    inputs:
      prepared_data: ${{parent.jobs.prepare_data.outputs.prepared_data}}
    outputs:
      inference_output:
        type: uri_folder

  evaluate:
    type: command
    is_deterministic: false
    code: ..
    environment: azureml:qwen-autoqc-sandbox-dev:6
    command: >-
      python scripts/azure/evaluate_pipeline_run.py
      --inference-output ${{inputs.inference_output}}
      --output-dir ${{outputs.evaluation_output}}
    inputs:
      inference_output: ${{parent.jobs.run_inference.outputs.inference_output}}
    outputs:
      evaluation_output: ${{parent.outputs.evaluation_report}}
